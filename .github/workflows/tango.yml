name: Shaping benchmarks
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tango:
    name: Tango shaping comparison
    runs-on: ubuntu-latest
    steps:
      - uses: harfbuzz/benchmark-harf@e358e6341e3f92d58f7e5f798da22329cfac9e1e
        with:
          engine: hb
          baseline: ${{ github.event.pull_request.base.sha }}
          candidate: ${{ github.sha }}
          peer-ref: main
