name: Shaping benchmarks
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tango:
    name: Tango shaping comparison
    runs-on: ubuntu-latest
    steps:
      - uses: harfbuzz/benchmark-harf@4b0804c824b4cc2d8e334d7959a754d8a7c429ce
        with:
          engine: hb
          baseline: ${{ github.event.pull_request.base.sha }}
          candidate: ${{ github.sha }}
          peer-ref: main
