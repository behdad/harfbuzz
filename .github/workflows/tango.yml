name: Shaping benchmarks
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tango:
    name: Tango shaping comparison
    runs-on: ubuntu-latest
    steps:
      - uses: harfbuzz/benchmark-harf@e92793bc24d3f5933cf344578c63b4f9926f25d1
        with:
          engine: hb
          baseline: ${{ github.event.pull_request.base.sha }}
          candidate: ${{ github.sha }}
